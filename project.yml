name: Cyllene
options:
  bundleIdPrefix: com.nulljosh
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
targets:
  Cyllene:
    type: application
    platform: macOS
    sources:
      - Sources
      - Shared
      - Cyllene.icon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nulljosh.hermes
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Cyllene
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: Cyllene
        MARKETING_VERSION: 10.9.1
        CURRENT_PROJECT_VERSION: 2
    scheme:
      testTargets: [CylleneTests]
  CyllenePhone:
    type: application
    platform: iOS
    info:
      path: iOS/Info.plist
      properties:
        NSFaceIDUsageDescription: Cyllene uses Face ID to unlock when App Lock is on.
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.nulljosh.hermes.refresh]
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchMark
          UIImageRespectsSafeAreaInsets: true
    sources:
      - iOS
      - Shared
      - Cyllene.icon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nulljosh.hermes
        PRODUCT_NAME: Cyllene
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: QMM486NPYC
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_KEY_CFBundleDisplayName: Cyllene
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: Cyllene
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: 11.0.0
        CURRENT_PROJECT_VERSION: 2
  CylleneTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests]
    dependencies:
      - target: Cyllene
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
